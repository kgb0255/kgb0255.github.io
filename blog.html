<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Personal Website">
<title>Blog | James Kwon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-header"></div>
<script src="assets/header.js"></script>

<div class="sidebar-layout">
<aside class="dir-tree"></aside>
<script src="assets/posts-data.js"></script>
<script src="assets/dir-tree.js"></script>
<script>
  renderDirTree({ rootLabel: 'Blog Main', rootHref: 'blog.html', items: SITE_POSTS, basePath: 'posts/' });
</script>

<main>
  <h1>Blog</h1>

  <div class="card-list" id="post-cards"></div>
  <script src="assets/post-card.js"></script>
  <script>
    renderPostCards('post-cards', SITE_POSTS.map(function (p) {
      return { href: 'posts/' + p.slug + '.html', category: p.category, date: p.date };
    }), 0);
  </script>
</main>
</div>

<div id="site-footer"></div>
<script src="assets/footer.js"></script>

</body>
</html>
